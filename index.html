<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Interface | Custom Web Design, Mobile Apps & Data Dashboards</title>
    <meta name="description" content="Meridian Interface is a digital design & development studio specializing in custom web applications, mobile interfaces, enterprise analytics dashboards, and brand identity systems." />
    <meta name="keywords" content="Meridian Interface, Web Design, Mobile App Development, UI UX Design, Analytics Dashboards, Brand Identity" />
    <meta name="author" content="Meridian Interface" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meridianinterface.com/" />
    <meta property="og:title" content="Meridian Interface | Digital Design & Development Studio" />
    <meta property="og:description" content="Custom web applications, mobile interfaces, analytics dashboards, and brand identity systems. Houston, Texas — otis@meridianinterface.com | 281-882-9198" />
    <meta property="og:site_name" content="Meridian Interface" />
    <meta property="og:locale" content="en_US" />
    <!-- The card image. Absolute URL, not a path: Facebook, LinkedIn, iMessage and
         Slack all fetch it from their own servers, where a relative path resolves
         to nothing. 1200x630 is the size every one of them crops to.
         Regenerate from the live hero if the homepage design changes. -->
    <meta property="og:image" content="https://meridianinterface.com/images/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meridian Interface — custom websites, apps, and dashboards, designed and built end to end." />

    <!-- Twitter.
         `name`, not `property`: the og: tags use RDFa and Twitter's parser reads
         plain name attributes. Written as property="twitter:card" this tag was
         silently ignored and shared links fell back to a small square thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://meridianinterface.com/" />
    <meta name="twitter:title" content="Meridian Interface | Digital Design & Development Studio" />
    <meta name="twitter:description" content="Custom web applications, mobile interfaces, analytics dashboards, and brand identity systems." />
    <meta name="twitter:image" content="https://meridianinterface.com/images/og-card.jpg" />
    <meta name="twitter:image:alt" content="Meridian Interface — custom websites, apps, and dashboards, designed and built end to end." />

    <!-- Mobile App & PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicon & Canonical.
         The mark alone, not the lockup: the lockup squeezed into a square turns
         the wordmark to mush at tab size, and meridian-icon-512.png has no
         transparency so it shows a pale box on a dark home screen. The mark
         holds down to about 20px on either ground. -->
    <link rel="icon" type="image/png" href="/brand/meridian-mark.png" />
    <link rel="apple-touch-icon" href="/brand/meridian-mark.png" />
    <link rel="canonical" href="https://meridianinterface.com/" />

    <!-- Fonts are self-hosted (see src/index.css / public/fonts) — no external CDN dependency. -->
  </head>
  <body class="bg-[#f7f9fd] text-[#191c1f] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
