<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Interface | Custom Web Design, Mobile Apps & Data Dashboards</title>
    <meta name="description" content="Meridian Interface is a digital design & development studio specializing in custom web applications, mobile interfaces, enterprise analytics dashboards, and brand identity systems." />
    <meta name="keywords" content="Meridian Interface, Web Design, Mobile App Development, UI UX Design, Analytics Dashboards, Brand Identity" />
    <meta name="author" content="Meridian Interface" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://meridianinterface.com/" />
    <meta property="og:title" content="Meridian Interface | Digital Design & Development Studio" />
    <meta property="og:description" content="Custom web applications, mobile interfaces, analytics dashboards, and brand identity systems. Houston, Texas — otis@meridianinterface.com | 281-882-9198" />
    <meta property="og:site_name" content="Meridian Interface" />
    <meta property="og:locale" content="en_US" />
    <!-- The card image. Absolute URL, not a path: Facebook, LinkedIn, iMessage and
         Slack all fetch it from their own servers, where a relative path resolves
         to nothing. 1200x630 is the size every one of them crops to.
         Regenerate from the live hero if the homepage design changes. -->
    <meta property="og:image" content="https://meridianinterface.com/images/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meridian Interface — custom websites, apps, and dashboards, designed and built end to end." />

    <!-- Twitter.
         `name`, not `property`: the og: tags use RDFa and Twitter's parser reads
         plain name attributes. Written as property="twitter:card" this tag was
         silently ignored and shared links fell back to a small square thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://meridianinterface.com/" />
    <meta name="twitter:title" content="Meridian Interface | Digital Design & Development Studio" />
    <meta name="twitter:description" content="Custom web applications, mobile interfaces, analytics dashboards, and brand identity systems." />
    <meta name="twitter:image" content="https://meridianinterface.com/images/og-card.jpg" />
    <meta name="twitter:image:alt" content="Meridian Interface — custom websites, apps, and dashboards, designed and built end to end." />

    <!-- Mobile App & PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Favicon & Canonical.
         The mark alone, not the lockup: the lockup squeezed into a square turns
         the wordmark to mush at tab size, and meridian-icon-512.png has no
         transparency so it shows a pale box on a dark home screen. The mark
         holds down to about 20px on either ground. -->
    <link rel="icon" type="image/png" href="/brand/meridian-mark.png" />
    <link rel="apple-touch-icon" href="/brand/meridian-mark.png" />
    <link rel="canonical" href="https://meridianinterface.com/" />

    <!-- Structured data.
         Everything above describes the page; this describes the business, and
         it is the only content on this site a search engine can read without
         running JavaScript. The app renders into an empty <div id="root">, so
         the served HTML carries no headings, no links and no prose — Google
         renders the page on a later pass and sees it, Bing, DuckDuckGo, Yandex
         and every AI crawler do not.

         Nothing here is invented. There is no street address because the
         business does not have one yet, so only the locality is claimed; there
         are no ratings, no review counts and no founding date, because those
         would be fabrications and the kind search engines penalise. Add
         streetAddress and sameAs when the LLC and the PO box exist. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://meridianinterface.com/#studio",
      "name": "Meridian Interface",
      "description": "Digital design and development studio. Custom web applications, mobile app interfaces, analytics and CRM dashboards, and brand identity systems.",
      "url": "https://meridianinterface.com/",
      "logo": "https://meridianinterface.com/brand/meridian-mark.png",
      "image": "https://meridianinterface.com/images/og-card.jpg",
      "email": "otis@meridianinterface.com",
      "telephone": "+1-281-882-9198",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Houston",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "City", "name": "Houston" },
        { "@type": "Country", "name": "United States" }
      ],
      "knowsAbout": [
        "Web design",
        "Web development",
        "Mobile app interface design",
        "Analytics dashboards",
        "CRM dashboards",
        "Brand identity design"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Studio services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Custom Web Design & Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Design & Development" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Data Analyst, CRM & Financial Dashboards" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Logo Design & Visual Identity" } }
        ]
      }
    }
    </script>

    <!-- Fonts are self-hosted (see src/index.css / public/fonts) — no external CDN dependency. -->
  </head>
  <body class="bg-[#f7f9fd] text-[#191c1f] antialiased">
    <div id="root"></div>

    <!-- The page, for anything that does not run JavaScript.
         =====================================================================
         The site renders entirely from JavaScript into the empty div above, so
         the HTML served to a crawler contains no prose at all — measured on
         16 Sep: 0 words, 0 headings, 0 links. Google renders on a second pass
         and sees the real thing. Bing renders inconsistently and DuckDuckGo
         takes Bing's index. Yandex, Applebot and every AI crawler — the ones
         answering "who builds dashboards in Houston" — do not render at all.

         Why <noscript> rather than prerendered markup inside #root: React
         clears that container when it mounts, so prerendered content flashes
         and is replaced. A white block appearing over a dark hero for 300ms
         is a visible regression on the first thing anyone sees. Content here
         never renders for a visitor whose JavaScript works, so there is no
         flash and nothing to reconcile.

         This is a fallback, not a trick. Every claim below is on the rendered
         page in the same words. If the page copy changes, change this too —
         a fallback that says something different from the page is cloaking,
         and search engines treat it accordingly.

         The better fix is server-side rendering, which would put all 1,332
         words into the HTML for every crawler and every visitor. That is a
         restructure of the app, not a tag, and it is a decision rather than a
         patch. -->
    <noscript>
      <main style="max-width:44rem;margin:0 auto;padding:3rem 1.25rem;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.65;color:#191c1f">
        <p style="font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#2563eb;margin:0 0 .5rem">
          Digital Design &amp; Development Studio
        </p>
        <h1 style="font-size:2rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 1rem">
          Custom websites, apps, and dashboards. Designed and built end to end.
        </h1>
        <p style="margin:0 0 2rem">
          Meridian Interface is a digital design and development studio in Houston, Texas.
          We design and develop bespoke web experiences, mobile app interfaces, analytics
          and CRM dashboards, and complete brand identities.
        </p>

        <h2 style="font-size:1.25rem;margin:0 0 .75rem">What we design and develop</h2>
        <ul style="margin:0 0 2rem;padding-left:1.25rem">
          <li><strong>Custom Web Design &amp; Development</strong> — bespoke web experiences, from landing pages to full multi-page business sites.</li>
          <li><strong>Mobile App Design &amp; Development</strong> — end-to-end mobile user flows, clickable prototypes and full iOS and Android interfaces.</li>
          <li><strong>Data Analyst, CRM &amp; Financial Dashboards</strong> — analytics and CRM dashboards that show a business what it is actually doing.</li>
          <li><strong>Your Business Tech Stack, Chosen and Connected</strong> — systems and integration work, so the tools you run talk to each other.</li>
          <li><strong>Logo Design &amp; Visual Identity</strong> — logos, vector iconography, colour palettes and typography rules.</li>
          <li><strong>Full Studio Design Bundle</strong> — web, app, dashboard and brand together.</li>
        </ul>

        <h2 style="font-size:1.25rem;margin:0 0 .75rem">Get in touch</h2>
        <p style="margin:0 0 .5rem">
          Book a one-to-one consultation, or reach the studio directly:
        </p>
        <p style="margin:0 0 2rem">
          <a href="mailto:otis@meridianinterface.com">otis@meridianinterface.com</a><br />
          <a href="tel:+12818829198">281-882-9198</a><br />
          Houston, Texas, United States
        </p>

        <p style="font-size:.8rem;color:#5b6472;margin:0">
          This page needs JavaScript for the full site — the portfolio, the booking
          form and the client portal. Everything above is the short version.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
